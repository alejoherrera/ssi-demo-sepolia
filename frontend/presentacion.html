<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSI Demo - Presentacion Interactiva</title>
    <style>
        :root {
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255,255,255,0.04);
            --accent: #00d2ff;
            --accent2: #7b68ee;
            --green: #51cf66;
            --red: #ff6b6b;
            --orange: #ffa94d;
            --text: #e0e0e0;
            --muted: #888;
            --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Top bar ── */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(10,10,26,0.92); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 28px; height: 56px;
        }
        .topbar-title {
            font-size: 1em; font-weight: 700;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .step-counter { font-size: 0.85em; color: var(--muted); }

        /* ── Progress bar ── */
        .progress-track {
            position: fixed; top: 56px; left: 0; right: 0; height: 3px;
            background: rgba(255,255,255,0.06); z-index: 100;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.5s ease;
        }

        /* ── Sidebar nav ── */
        .sidebar {
            position: fixed; left: 0; top: 59px; bottom: 0; width: 260px;
            background: rgba(10,10,26,0.6); backdrop-filter: blur(12px);
            border-right: 1px solid var(--border);
            overflow-y: auto; padding: 20px 0; z-index: 90;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .nav-section { padding: 8px 20px; font-size: 0.7em; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--muted); margin-top: 12px; }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px; cursor: pointer; font-size: 0.88em;
            transition: all 0.2s; border-left: 3px solid transparent;
            color: var(--muted);
        }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
        .nav-item.active { border-left-color: var(--accent); color: #fff;
            background: rgba(0,210,255,0.06); }
        .nav-item.done { color: var(--green); }
        .nav-item .nav-num {
            width: 24px; height: 24px; border-radius: 50%; font-size: 0.75em;
            display: flex; align-items: center; justify-content: center;
            border: 1.5px solid currentColor; flex-shrink: 0;
        }
        .nav-item.done .nav-num { background: var(--green); color: var(--bg-dark); border-color: var(--green); }
        .nav-item.active .nav-num { background: var(--accent); color: var(--bg-dark); border-color: var(--accent); }

        /* ── Main content ── */
        .main { margin-left: 260px; margin-top: 59px; padding: 36px 48px 100px; max-width: 960px; }

        /* ── Slides ── */
        .slide { display: none; animation: fadeSlide 0.4s ease; }
        .slide.active { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide h2 {
            font-size: 1.7em; margin-bottom: 6px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .slide .lead { color: var(--muted); font-size: 1em; margin-bottom: 28px; }

        /* ── Reusable blocks ── */
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; padding: 22px 26px; margin-bottom: 18px;
        }
        .card h3 { font-size: 1.05em; margin-bottom: 10px; color: #fff; }

        .step-box {
            display: flex; gap: 14px; margin-bottom: 16px;
            padding: 14px 18px; border-radius: 12px;
            background: rgba(255,255,255,0.025); border: 1px solid var(--border);
            align-items: flex-start;
        }
        .step-num {
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; font-size: 0.85em; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 2px;
        }
        .step-content { flex: 1; }
        .step-content strong { display: block; margin-bottom: 4px; }
        .step-content p { color: var(--muted); font-size: 0.9em; line-height: 1.5; }

        pre {
            background: #0d0d22; border: 1px solid var(--border);
            border-radius: 10px; padding: 16px 20px; overflow-x: auto;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85em; line-height: 1.6; margin: 12px 0;
            position: relative;
        }
        pre .copy-btn {
            position: absolute; top: 8px; right: 8px;
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            color: var(--muted); padding: 4px 10px; border-radius: 6px;
            font-size: 0.75em; cursor: pointer; transition: all 0.2s;
        }
        pre .copy-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

        .kw { color: #c792ea; }
        .fn { color: #82aaff; }
        .str { color: #c3e88d; }
        .cmt { color: #546e7a; }
        .typ { color: #ffcb6b; }
        .num { color: #f78c6c; }
        .mod { color: #89ddff; }
        .var { color: #eeffff; }

        .callout {
            border-radius: 12px; padding: 16px 20px; margin: 16px 0;
            display: flex; gap: 12px; align-items: flex-start;
            font-size: 0.9em; line-height: 1.5;
        }
        .callout .icon { font-size: 1.3em; flex-shrink: 0; margin-top: 1px; }
        .callout.info { background: rgba(0,210,255,0.08); border: 1px solid rgba(0,210,255,0.2); }
        .callout.warn { background: rgba(255,169,77,0.08); border: 1px solid rgba(255,169,77,0.2); }
        .callout.success { background: rgba(81,207,102,0.08); border: 1px solid rgba(81,207,102,0.2); }
        .callout.danger { background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); }

        .tag {
            display: inline-block; padding: 3px 10px; border-radius: 6px;
            font-size: 0.78em; font-weight: 600;
        }
        .tag.sol { background: rgba(0,210,255,0.15); color: var(--accent); }
        .tag.concept { background: rgba(123,104,238,0.15); color: var(--accent2); }
        .tag.metamask { background: rgba(255,169,77,0.15); color: var(--orange); }

        .diagram {
            display: flex; align-items: center; justify-content: center;
            gap: 0; margin: 24px 0; flex-wrap: wrap;
        }
        .diagram-box {
            background: var(--bg-card); border: 1.5px solid var(--border);
            border-radius: 12px; padding: 14px 20px; text-align: center;
            min-width: 130px;
        }
        .diagram-box .d-icon { font-size: 1.6em; margin-bottom: 4px; }
        .diagram-box .d-label { font-size: 0.82em; font-weight: 600; }
        .diagram-box .d-sub { font-size: 0.72em; color: var(--muted); }
        .diagram-arrow { font-size: 1.5em; color: var(--accent); padding: 0 8px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }

        .checklist label {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 10px; cursor: pointer;
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            margin-bottom: 8px; font-size: 0.9em; transition: all 0.2s;
        }
        .checklist label:hover { background: rgba(255,255,255,0.05); }
        .checklist input[type="checkbox"] { accent-color: var(--green); width: 18px; height: 18px; }
        .checklist label.checked { border-color: var(--green); background: rgba(81,207,102,0.05); }

        /* ── Screenshot placeholder ── */
        .screenshot {
            border: 1.5px dashed var(--border); border-radius: 14px;
            padding: 30px; text-align: center; color: var(--muted);
            font-size: 0.85em; margin: 14px 0;
            background: repeating-linear-gradient(
                45deg, transparent, transparent 10px,
                rgba(255,255,255,0.01) 10px, rgba(255,255,255,0.01) 20px
            );
        }
        .screenshot .ss-icon { font-size: 2.2em; margin-bottom: 8px; opacity: 0.5; }

        /* ── Nav buttons ── */
        .nav-buttons {
            display: flex; gap: 12px; margin-top: 36px; padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .btn {
            padding: 12px 28px; border-radius: 10px; font-size: 0.95em;
            font-weight: 600; cursor: pointer; border: none; transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,210,255,0.25); }
        .btn-secondary {
            background: rgba(255,255,255,0.06); color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        .principle-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 18px 0;
        }
        .principle-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 18px; transition: all 0.3s;
        }
        .principle-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .principle-card .p-icon { font-size: 1.5em; margin-bottom: 6px; }
        .principle-card .p-title { font-weight: 700; margin-bottom: 4px; }
        .principle-card .p-desc { font-size: 0.82em; color: var(--muted); line-height: 1.4; }

        /* ── Interactive demo area ── */
        .demo-area {
            background: #080818; border: 1.5px solid var(--border);
            border-radius: 14px; padding: 24px; margin: 16px 0;
        }
        .demo-area h4 { color: var(--accent); margin-bottom: 14px; font-size: 0.95em; }
        .demo-input {
            background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 0.9em;
            width: 100%; margin-bottom: 10px; font-family: monospace;
        }
        .demo-input::placeholder { color: #555; }
        .demo-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; border: none; padding: 10px 22px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 0.88em;
            transition: all 0.3s;
        }
        .demo-btn:hover { transform: translateY(-1px); }
        .demo-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .demo-btn.danger { background: linear-gradient(135deg, var(--red), #ee5a24); }
        .demo-output {
            background: rgba(0,0,0,0.3); border-radius: 8px; padding: 14px;
            font-family: monospace; font-size: 0.85em; margin-top: 12px;
            min-height: 40px; white-space: pre-wrap; line-height: 1.5;
        }
        .demo-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .demo-row .demo-input { margin-bottom: 0; flex: 1; min-width: 180px; }

        /* ── Countdown ring ── */
        .countdown-container { text-align: center; margin: 20px 0; }
        .countdown-ring { position: relative; width: 140px; height: 140px; margin: 0 auto; }
        .countdown-ring svg { transform: rotate(-90deg); }
        .countdown-ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .countdown-ring .bg-ring { stroke: rgba(255,255,255,0.06); }
        .countdown-ring .fg-ring { stroke: var(--accent); transition: stroke-dashoffset 1s linear, stroke 0.3s; }
        .countdown-time {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            font-size: 2.2em; font-weight: 700;
        }

        /* ── Timeline ── */
        .timeline { position: relative; padding-left: 30px; margin: 20px 0; }
        .timeline::before {
            content: ''; position: absolute; left: 11px; top: 0; bottom: 0;
            width: 2px; background: var(--border);
        }
        .tl-item { position: relative; margin-bottom: 20px; }
        .tl-item::before {
            content: ''; position: absolute; left: -24px; top: 6px;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent); border: 2px solid var(--bg-dark);
        }
        .tl-item.tl-red::before { background: var(--red); }
        .tl-item.tl-green::before { background: var(--green); }
        .tl-item.tl-orange::before { background: var(--orange); }
        .tl-item strong { display: block; margin-bottom: 3px; }
        .tl-item p { color: var(--muted); font-size: 0.88em; }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 24px 20px 80px; }
            .principle-grid, .grid-2 { grid-template-columns: 1fr; }
            .diagram { flex-direction: column; }
            .diagram-arrow { transform: rotate(90deg); }
        }
    </style>
</head>
<body>

<!-- ── Top bar ── -->
<div class="topbar">
    <span class="topbar-title">SSI Demo — Guia Interactiva</span>
    <span class="step-counter" id="stepCounter">Paso 1 / 10</span>
</div>
<div class="progress-track"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>

<!-- ── Sidebar ── -->
<div class="sidebar" id="sidebar"></div>

<!-- ── Main ── -->
<div class="main" id="mainContent"></div>

<script>
// =====================================================================
// Slide definitions
// =====================================================================
const slides = [
{
    id: 'intro',
    nav: 'Introduccion',
    section: 'Teoria',
    title: 'Identidad Digital Autosoberana',
    lead: 'Que es SSI y por que importa',
    html: `
        <div class="card">
            <h3>Que es SSI (Self-Sovereign Identity)?</h3>
            <p style="color:var(--muted);line-height:1.7;margin-bottom:16px">
                La Identidad Digital Autosoberana es un modelo donde <strong style="color:#fff">el individuo controla
                sus propios datos de identidad</strong>, sin depender de una autoridad central. Usa criptografia
                y blockchain para garantizar que solo el titular decide quien, cuando y por cuanto tiempo
                puede ver su informacion.
            </p>
        </div>

        <div class="principle-grid">
            <div class="principle-card">
                <div class="p-icon">&#x1F464;</div>
                <div class="p-title">Control del Titular</div>
                <div class="p-desc">Solo el dueno de la identidad gestiona quien accede a sus datos. Nadie mas puede otorgar o revocar permisos.</div>
            </div>
            <div class="principle-card">
                <div class="p-icon">&#x1F3AF;</div>
                <div class="p-title">Divulgacion Selectiva</div>
                <div class="p-desc">El titular elige exactamente que datos compartir y con quien. No es todo-o-nada.</div>
            </div>
            <div class="principle-card">
                <div class="p-icon">&#x23F1;</div>
                <div class="p-title">Acceso Temporal</div>
                <div class="p-desc">Los permisos tienen una ventana de tiempo limitada. Tras expirar, el acceso se corta automaticamente.</div>
            </div>
            <div class="principle-card">
                <div class="p-icon">&#x1F6AB;</div>
                <div class="p-title">Revocabilidad</div>
                <div class="p-desc">El titular puede revocar el acceso en cualquier momento, incluso antes de que expire.</div>
            </div>
        </div>

        <div class="callout info">
            <span class="icon">&#x1F4A1;</span>
            <div>En esta demo usamos un smart contract en <strong>Ethereum Sepolia</strong> (testnet) para
            implementar estos 4 principios. El contrato almacena un dato personal y controla
            quien puede verlo, por cuanto tiempo y con que proposito.</div>
        </div>
    `
},
{
    id: 'architecture',
    nav: 'Arquitectura',
    section: 'Teoria',
    title: 'Arquitectura del Sistema',
    lead: 'Como interactuan los componentes',
    html: `
        <div class="diagram">
            <div class="diagram-box">
                <div class="d-icon">&#x1F464;</div>
                <div class="d-label">Titular (Owner)</div>
                <div class="d-sub">MetaMask Cuenta #1</div>
            </div>
            <div class="diagram-arrow">&#x27A1;</div>
            <div class="diagram-box" style="border-color:var(--accent)">
                <div class="d-icon">&#x1F4DC;</div>
                <div class="d-label">Smart Contract</div>
                <div class="d-sub">SSIAccessControl.sol</div>
            </div>
            <div class="diagram-arrow">&#x27A1;</div>
            <div class="diagram-box">
                <div class="d-icon">&#x1F50D;</div>
                <div class="d-label">Verificador</div>
                <div class="d-sub">MetaMask Cuenta #2</div>
            </div>
        </div>

        <div class="card">
            <h3>Flujo completo</h3>
            <div class="timeline">
                <div class="tl-item tl-green">
                    <strong>1. Deploy</strong>
                    <p>El Titular despliega el contrato con su dato personal y la duracion de acceso (30 min).</p>
                </div>
                <div class="tl-item">
                    <strong>2. Grant Access</strong>
                    <p>El Titular llama a <code>grantAccess(direccion, proposito)</code> para autorizar a un verificador.</p>
                </div>
                <div class="tl-item tl-orange">
                    <strong>3. Ventana Temporal</strong>
                    <p>El Verificador tiene 30 minutos para llamar a <code>viewData()</code> y ver el dato.</p>
                </div>
                <div class="tl-item tl-red">
                    <strong>4. Expiracion / Revocacion</strong>
                    <p>El acceso expira automaticamente o el Titular lo revoca antes con <code>revokeAccess()</code>.</p>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>Stack Tecnologico</h3>
                <p style="font-size:0.9em;color:var(--muted);line-height:1.8">
                    <span class="tag sol">Solidity ^0.8.19</span> Smart Contract<br>
                    <span class="tag metamask">MetaMask</span> Wallet / Firma<br>
                    <span class="tag concept">ethers.js v6</span> Conexion Web3<br>
                    <span class="tag sol">Remix IDE</span> Compilacion y deploy<br>
                    <span class="tag concept">Sepolia</span> Testnet Ethereum
                </p>
            </div>
            <div class="card">
                <h3>Archivos del Proyecto</h3>
                <pre style="margin:0;border:none;padding:10px"><span class="cmt">ssi-demo-sepolia/</span>
├── contracts/
│   └── <span class="fn">SSIAccessControl.sol</span>
├── frontend/
│   ├── <span class="fn">index.html</span>
│   └── <span class="fn">presentacion.html</span>
└── <span class="cmt">README.md</span></pre>
            </div>
        </div>
    `
},
{
    id: 'contract-code',
    nav: 'Codigo del Contrato',
    section: 'Contrato',
    title: 'Analisis del Smart Contract',
    lead: 'Entendiendo SSIAccessControl.sol linea por linea',
    html: `
        <div class="card">
            <h3>Estructura principal</h3>
            <pre><button class="copy-btn" onclick="copyCode(this)">Copiar</button><span class="kw">contract</span> <span class="typ">SSIAccessControl</span> {

    <span class="kw">address</span> <span class="kw">public</span>  <span class="var">owner</span>;           <span class="cmt">// Titular de la identidad</span>
    <span class="kw">string</span>  <span class="kw">private</span> <span class="var">personalData</span>;    <span class="cmt">// Dato protegido</span>
    <span class="kw">uint256</span> <span class="kw">public</span>  <span class="var">defaultDuration</span>; <span class="cmt">// Segundos de acceso (ej: 1800 = 30 min)</span>

    <span class="kw">struct</span> <span class="typ">AccessGrant</span> {
        <span class="kw">bool</span>    authorized;    <span class="cmt">// tiene permiso?</span>
        <span class="kw">uint256</span> grantedAt;     <span class="cmt">// timestamp de inicio</span>
        <span class="kw">uint256</span> expiresAt;     <span class="cmt">// timestamp de expiracion</span>
        <span class="kw">string</span>  purpose;       <span class="cmt">// proposito del acceso</span>
    }

    <span class="kw">mapping</span>(<span class="kw">address</span> => <span class="typ">AccessGrant</span>) <span class="kw">public</span> <span class="var">accessGrants</span>;
}</pre>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>Modifier: onlyOwner</h3>
                <pre style="margin:0;border:none;padding:8px"><span class="kw">modifier</span> <span class="fn">onlyOwner</span>() {
    <span class="fn">require</span>(
        msg.sender == owner,
        <span class="str">"Solo el titular"</span>
    );
    _;
}</pre>
                <p style="font-size:0.82em;color:var(--muted);margin-top:8px">
                    Protege funciones que solo el titular puede ejecutar:
                    grantAccess, revokeAccess, updatePersonalData.
                </p>
            </div>
            <div class="card">
                <h3>Modifier: hasValidAccess</h3>
                <pre style="margin:0;border:none;padding:8px"><span class="kw">modifier</span> <span class="fn">hasValidAccess</span>() {
    <span class="fn">require</span>(
        grant.authorized,
        <span class="str">"No tienes autorizacion"</span>
    );
    <span class="fn">require</span>(
        block.timestamp <= grant.expiresAt,
        <span class="str">"Tu acceso ha expirado"</span>
    );
    _;
}</pre>
                <p style="font-size:0.82em;color:var(--muted);margin-top:8px">
                    Doble verificacion: que este autorizado Y que no haya expirado.
                </p>
            </div>
        </div>

        <div class="card">
            <h3>Funciones clave</h3>
            <table style="width:100%;font-size:0.88em;border-collapse:collapse">

// =====================================================================
// Rendering engine
// =====================================================================
let currentSlide = 0;

function buildSidebar() {
    const sb = document.getElementById('sidebar');
    let currentSection = '';
    let html = '';
    slides.forEach((s, i) => {
        if (s.section !== currentSection) {
            currentSection = s.section;
            html += `<div class="nav-section">${currentSection}</div>`;
        }
        html += `<div class="nav-item${i === 0 ? ' active' : ''}" data-index="${i}" onclick="goTo(${i})">
            <div class="nav-num">${i + 1}</div>
            <span>${s.nav}</span>
        </div>`;
    });
    sb.innerHTML = html;
}

function renderSlide(index) {
    const s = slides[index];
    const main = document.getElementById('mainContent');
    const isFirst = index === 0;
    const isLast = index === slides.length - 1;

    main.innerHTML = `
        <div class="slide active" id="slide-${s.id}">
            <div style="display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap">
                <span class="tag concept">${s.section}</span>
            </div>
            <h2>${s.title}</h2>
            <p class="lead">${s.lead}</p>
            ${s.html}
            <div class="nav-buttons">
                ${isFirst ? '' : `<button class="btn btn-secondary" onclick="prev()">&#x2190; Anterior</button>`}
                <div style="flex:1"></div>
                ${isLast ? '' : `<button class="btn btn-primary" onclick="next()">Siguiente &#x2192;</button>`}
            </div>
        </div>
    `;

    // Update nav
    document.querySelectorAll('.nav-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
        el.classList.toggle('done', i < index);
    });

    // Update counter + progress
    document.getElementById('stepCounter').textContent = `Paso ${index + 1} / ${slides.length}`;
    document.getElementById('progressFill').style.width = `${((index + 1) / slides.length) * 100}%`;

    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goTo(i) { currentSlide = i; renderSlide(i); }
function next() { if (currentSlide < slides.length - 1) goTo(currentSlide + 1); }
function prev() { if (currentSlide > 0) goTo(currentSlide - 1); }

// Keyboard nav
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
});

const CONTRACT_SOURCE = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.19;

contract SSIAccessControl {

    address public owner;
    string  private personalData;
    uint256 public  defaultDuration;

    struct AccessGrant {
        bool    authorized;
        uint256 grantedAt;
        uint256 expiresAt;
        string  purpose;
    }

    mapping(address => AccessGrant) public accessGrants;
    address[] public authorizedList;

    event AccessGranted(address indexed viewer, uint256 expiresAt, string purpose);
    event AccessRevoked(address indexed viewer, string reason);
    event DataAccessed(address indexed viewer, uint256 timestamp);
    event DataUpdated(uint256 timestamp);

    modifier onlyOwner() {
        require(msg.sender == owner, "Solo el titular puede realizar esta accion");
        _;
    }

    modifier hasValidAccess() {
        AccessGrant memory grant = accessGrants[msg.sender];
        require(grant.authorized, "No tienes autorizacion");
        require(block.timestamp <= grant.expiresAt, "Tu acceso ha expirado");
        _;
    }

    constructor(string memory _personalData, uint256 _defaultDuration) {
        owner = msg.sender;
        personalData = _personalData;
        defaultDuration = _defaultDuration;
    }

    function grantAccess(address _viewer, string memory _purpose) external onlyOwner {
        require(_viewer != address(0), "Direccion invalida");
        if (!accessGrants[_viewer].authorized) { authorizedList.push(_viewer); }
        uint256 expiry = block.timestamp + defaultDuration;
        accessGrants[_viewer] = AccessGrant(true, block.timestamp, expiry, _purpose);
        emit AccessGranted(_viewer, expiry, _purpose);
    }

    function grantAccessCustom(
        address _viewer, uint256 _seconds, string memory _purpose
    ) external onlyOwner {
        require(_viewer != address(0) && _seconds > 0);
        if (!accessGrants[_viewer].authorized) { authorizedList.push(_viewer); }
        uint256 expiry = block.timestamp + _seconds;
        accessGrants[_viewer] = AccessGrant(true, block.timestamp, expiry, _purpose);
        emit AccessGranted(_viewer, expiry, _purpose);
    }

    function revokeAccess(address _viewer, string memory _reason) external onlyOwner {
        require(accessGrants[_viewer].authorized, "No tiene acceso");
        accessGrants[_viewer].authorized = false;
        accessGrants[_viewer].expiresAt = block.timestamp;
        emit AccessRevoked(_viewer, _reason);
    }

    function updatePersonalData(string memory _newData) external onlyOwner {
        personalData = _newData;
        emit DataUpdated(block.timestamp);
    }

    function setDefaultDuration(uint256 _newDuration) external onlyOwner {
        defaultDuration = _newDuration;
    }

    function viewData() external hasValidAccess returns (string memory) {
        emit DataAccessed(msg.sender, block.timestamp);
        return personalData;
    }

    function viewDataAsOwner() external view onlyOwner returns (string memory) {
        return personalData;
    }

    function hasAccess(address _viewer) external view returns (bool) {
        AccessGrant memory g = accessGrants[_viewer];
        return g.authorized && block.timestamp <= g.expiresAt;
    }

    function remainingTime(address _viewer) external view returns (uint256) {
        AccessGrant memory g = accessGrants[_viewer];
        if (!g.authorized || block.timestamp > g.expiresAt) return 0;
        return g.expiresAt - block.timestamp;
    }

    function getAccessDetails(address _viewer) external view returns (
        bool authorized, uint256 grantedAt, uint256 expiresAt,
        string memory purpose, uint256 secondsRemaining
    ) {
        AccessGrant memory g = accessGrants[_viewer];
        uint256 rem = 0;
        if (g.authorized && block.timestamp <= g.expiresAt) { rem = g.expiresAt - block.timestamp; }
        return (g.authorized, g.grantedAt, g.expiresAt, g.purpose, rem);
    }

    function getAuthorizedCount() external view returns (uint256) {
        return authorizedList.length;
    }
}`;

// Countdown simulation
let simCountdownInterval = null;
function startSimCountdown() {
    const circle = document.getElementById('simCircle');
    const text = document.getElementById('simTimer');
    const viewBtn = document.getElementById('simViewBtn');
    const startBtn = document.getElementById('simStartBtn');
    const reveal = document.getElementById('simDataReveal');
    if (!circle || !text) return;

    if (simCountdownInterval) clearInterval(simCountdownInterval);
    if (reveal) reveal.innerHTML = '';

    const total = 30; // 30s para la simulacion (en el contrato real son 1800s = 30 min)
    let remaining = total;
    const circ = 364.42;
    startBtn.disabled = true;
    viewBtn.disabled = false;

    function fmtSim(s) { return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
    function update() {
        text.textContent = fmtSim(remaining);
        circle.style.strokeDashoffset = circ * (1 - remaining / total);
        circle.style.stroke = remaining <= 5 ? 'var(--red)' : 'var(--accent)';
        text.style.color = remaining <= 5 ? 'var(--red)' : 'var(--text)';
    }
    update();

    simCountdownInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
            clearInterval(simCountdownInterval);
            text.textContent = '0:00';
            circle.style.strokeDashoffset = circ;
            viewBtn.disabled = true;
            startBtn.disabled = false;
            if (reveal) reveal.innerHTML = '<div style="background:rgba(255,107,107,0.1);border:2px solid var(--red);border-radius:12px;padding:16px;text-align:center;color:var(--red);font-weight:600">Tiempo agotado — acceso expirado</div>';
        } else { update(); }
    }, 1000);
}
